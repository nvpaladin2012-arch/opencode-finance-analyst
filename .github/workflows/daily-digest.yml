name: Daily finance digest (12:00 Tyumen)

on:
  schedule:
    # 07:00 UTC = 12:00 по Тюмени (UTC+5) = 10:00 МСК
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch live quotes via web APIs
        run: python scripts/update_digest.py

      - name: Publish data.json and digest.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json digest.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily digest: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
